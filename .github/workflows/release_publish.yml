name: Release publish

# Reusable workflow: after a release/v<version> pull request (opened by release_prepare) is merged, tag the merge
# commit on the base branch as v<version> and create the GitHub release, with notes from the changelog (or
# generated by GitHub if there is no changelog) and optional files from an artifact. Call it from a workflow
# triggered by `pull_request: types: [closed]`; it does nothing unless the PR was merged from a release/v* branch.
# Can also be called with explicit version and target, e.g. to re-publish manually.

on:
  workflow_call:
    inputs:
      version:
        description: "Version to publish; defaults to the merged release/v<version> branch name"
        required: false
        type: string
        default: ""
      target:
        description: "Commit to tag; defaults to the pull request's merge commit"
        required: false
        type: string
        default: ""
      changelog_path:
        description: "Path to the changelog; GitHub-generated notes are used if the file does not exist"
        required: false
        type: string
        default: CHANGELOG.md
      artifact:
        description: "Name of an artifact from the calling run whose files are attached to the release"
        required: false
        type: string
        default: ""
      environment:
        description: "Deployment environment for the publish job (e.g. to require approval); none if empty"
        required: false
        type: string
        default: ""
      delete_branch:
        description: "Delete the release/v<version> branch after publishing"
        required: false
        type: boolean
        default: true
    secrets:
      token:
        description: "Token used to create the tag and release (GitHub App or PAT) so they trigger other workflows; defaults to GITHUB_TOKEN"
        required: false
    outputs:
      published:
        description: "Whether a release was published ('true'/'false')"
        value: ${{ jobs.publish.outputs.published }}
      version:
        description: "Published version"
        value: ${{ jobs.publish.outputs.version }}
      tag:
        description: "Release tag"
        value: ${{ jobs.publish.outputs.tag }}
      prerelease:
        description: "Whether this is a prerelease"
        value: ${{ jobs.publish.outputs.prerelease }}
      release_url:
        description: "URL of the GitHub release"
        value: ${{ jobs.publish.outputs.release_url }}

jobs:
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      published: ${{ steps.release.outcome == 'success' }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      release_url: ${{ steps.release.outputs.url }}

    steps:
      - name: Resolve version and target
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TARGET: ${{ inputs.target }}
          MERGED: ${{ github.event.pull_request.merged }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version="${INPUT_VERSION#v}"
            target="${INPUT_TARGET:-$GITHUB_SHA}"
            base=""
          elif [ "$MERGED" = true ] && [[ "$HEAD_REF" == release/v* ]]; then
            version="${HEAD_REF#release/v}"
            target="${INPUT_TARGET:-$MERGE_SHA}"
            base="$BASE_REF"
          else
            echo "Not a merged release/v* pull request and no version given; nothing to publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a valid semantic version"
            exit 1
          fi
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi

          echo "Publishing v${version} at ${target} (prerelease: ${prerelease})"
          {
            echo "skip=false"
            echo "version=$version"
            echo "tag=v$version"
            echo "target=$target"
            echo "base=$base"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.resolve.outputs.skip == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.target }}
          token: ${{ secrets.token || github.token }}
          fetch-depth: 0
          filter: tree:0

      - name: Check target and tag
        if: steps.resolve.outputs.skip == 'false'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          TARGET: ${{ steps.resolve.outputs.target }}
          BASE: ${{ steps.resolve.outputs.base }}
        run: |
          # release_prepare only counts tags reachable from the base branch
          if [ -n "$BASE" ] && ! git merge-base --is-ancestor "$TARGET" "origin/${BASE}"; then
            echo "::error::${TARGET} is not on ${BASE}; the tag would not be found by the next release_prepare run"
            exit 1
          fi
          if existing=$(git rev-parse -q --verify "refs/tags/${TAG}^{commit}"); then
            if [ "$existing" != "$(git rev-parse "${TARGET}^{commit}")" ]; then
              echo "::error::Tag ${TAG} already exists on a different commit (${existing})"
              exit 1
            fi
            echo "Tag ${TAG} already exists on ${TARGET}; reusing it"
          fi

      - name: Get changelog release notes
        id: changelog
        if: steps.resolve.outputs.skip == 'false' && hashFiles(inputs.changelog_path) != ''
        uses: release-flow/keep-a-changelog-action@74931dec7ecdbfc8e38ac9ae7e8dd84c08db2f32 # v3.0.0
        with:
          command: query
          version: ${{ steps.resolve.outputs.version }}
          changelog: ${{ inputs.changelog_path }}

      - name: Download release files
        if: steps.resolve.outputs.skip == 'false' && inputs.artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/release-files

      - name: Create tag and GitHub release
        id: release
        if: steps.resolve.outputs.skip == 'false'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ secrets.token || github.token }}
          tag_name: ${{ steps.resolve.outputs.tag }}
          target_commitish: ${{ steps.resolve.outputs.target }}
          name: ${{ steps.resolve.outputs.tag }}
          body: ${{ steps.changelog.outputs.release-notes }}
          generate_release_notes: ${{ steps.changelog.outputs.release-notes == '' }}
          prerelease: ${{ steps.resolve.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.resolve.outputs.prerelease == 'true' && 'false' || 'true' }}
          files: ${{ inputs.artifact != '' && format('{0}/release-files/**', runner.temp) || '' }}
          fail_on_unmatched_files: ${{ inputs.artifact != '' }}

      - name: Delete release branch
        if: steps.release.outcome == 'success' && inputs.delete_branch
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          # GitHub may already have deleted it ("Automatically delete head branches")
          git push origin --delete "release/v${VERSION}" || echo "release/v${VERSION} already deleted"

      - name: Summary
        if: steps.release.outcome == 'success'
        env:
          URL: ${{ steps.release.outputs.url }}
        run: |
          echo "Release: $URL" >> "$GITHUB_STEP_SUMMARY"
