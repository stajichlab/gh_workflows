name: Test bioconda_recipe_solve

# End-to-end test: commit two small fixed recipes to a throwaway orphan branch, one with its python range written out
# literally and one taking it from {% set python_min/python_max %} variables, and run bioconda_recipe_solve on both;
# each must solve on every Python. Fixed fixtures rather than a live bioconda recipe, whose dependencies may lag a
# new Python and fail the test for reasons outside this repo. The unsolvable case is not run, since the called
# job would fail this workflow. The branch is deleted afterwards.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/bioconda_recipe_solve.yml
      - .github/workflows/test_bioconda_recipe_solve.yml

concurrency:
  group: test-bioconda-recipe-solve
  cancel-in-progress: false

permissions:
  contents: write

env:
  BASE: test/bioconda-solve-${{ github.run_id }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.fixture.outputs.ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create fixture branch
        id: fixture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan "$BASE"
          mkdir literal vars
          cat > literal/meta.yaml <<'YAML'
          package:
            name: fixture
            version: "0.0.1"

          requirements:
            run:
              - python >=3.11,<3.13
              - biopython >=1.81
              - samtools
          YAML
          cat > vars/meta.yaml <<'YAML'
          {% set name = "fixture" %}
          {% set python_min = "3.11" %}
          {% set python_max = "3.13" %}

          package:
            name: {{ name }}
            version: "0.0.1"

          requirements:
            host:
              - python {{ python_min }}
            run:
              - python >={{ python_min }},<{{ python_max }}
              - biopython >=1.81  # comment is ignored
              - samtools

          test:
            commands:
              - true
          YAML
          git add literal vars
          git commit -m "Test fixture"
          git push origin "$BASE"
          echo "ref=$BASE" >> "$GITHUB_OUTPUT"

  literal:
    needs: setup
    uses: ./.github/workflows/bioconda_recipe_solve.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.setup.outputs.ref }}
      recipe_path: literal/meta.yaml

  vars:
    needs: setup
    uses: ./.github/workflows/bioconda_recipe_solve.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.setup.outputs.ref }}
      recipe_path: vars/meta.yaml

  explicit:
    needs: setup
    uses: ./.github/workflows/bioconda_recipe_solve.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.setup.outputs.ref }}
      recipe_path: vars/meta.yaml
      python_versions: "3.12"

  verify:
    needs: [literal, vars, explicit]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          FAILED: ${{ needs.literal.outputs.failed }}${{ needs.vars.outputs.failed }}${{ needs.explicit.outputs.failed }}
        run: |
          [ -z "$FAILED" ] || { echo "::error::solvable recipes reported unsolvable on: $FAILED"; exit 1; }
          echo "All fixtures solved"

  cleanup:
    needs: [setup, literal, vars, explicit, verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Delete fixture branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if out=$(gh api -X DELETE "repos/${REPO}/git/refs/heads/${BASE}" 2>&1); then
            echo "Deleted ${BASE}"
          elif grep -q "Reference does not exist" <<<"$out"; then
            echo "Already gone: ${BASE}"
          else
            echo "::error::Could not delete ${BASE}: $out"
            exit 1
          fi
