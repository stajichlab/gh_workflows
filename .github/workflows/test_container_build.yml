name: Test container_build

# End-to-end test: build a tiny image from a throwaway orphan branch for a release and a prerelease version, run the
# smoke test, and check the computed tags. The release build also passes sign: true with push: false, which must skip
# signing. The signed build pushes an unversioned image, signs it with Cosign and verifies the signature; its package
# versions are deleted again at the end.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/container_build.yml
      - .github/workflows/test_container_build.yml

concurrency:
  group: test-container-build
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write

env:
  BASE: test/container-${{ github.run_id }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.fixture.outputs.ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create fixture branch
        id: fixture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan "$BASE"
          cat > Dockerfile <<'DOCKER'
          FROM busybox:1.36
          ARG GREETING=hello
          RUN echo "$GREETING" > /greeting
          ENTRYPOINT ["sh", "-c", "cat /greeting && echo \"$@\"", "--"]
          DOCKER
          git add Dockerfile
          git commit -m "Test fixture"
          git push origin "$BASE"
          echo "ref=$BASE" >> "$GITHUB_OUTPUT"

  release:
    needs: setup
    uses: ./.github/workflows/container_build.yml
    with:
      ref: ${{ needs.setup.outputs.ref }}
      version: v1.2.3
      image: ghcr.io/${{ github.repository_owner }}/container-build-test
      build_args: GREETING=smoke-ok
      smoke_test_args: --version
      # latest is left at its default (true) so the test covers it
      extra_tags: testing
      push: false
      # Must be a no-op without push
      sign: true

  prerelease:
    needs: setup
    uses: ./.github/workflows/container_build.yml
    with:
      ref: ${{ needs.setup.outputs.ref }}
      version: 1.3.0-rc.0
      image: ghcr.io/${{ github.repository_owner }}/container-build-test
      latest: true
      push: false

  signed:
    needs: setup
    uses: ./.github/workflows/container_build.yml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      ref: ${{ needs.setup.outputs.ref }}
      image: ghcr.io/${{ github.repository_owner }}/container-build-test
      extra_tags: signed-${{ github.run_id }}
      push: true
      sign: true

  verify:
    needs: [release, prerelease, signed]
    runs-on: ubuntu-latest
    steps:
      - name: Check tags
        env:
          RELEASE_TAGS: ${{ needs.release.outputs.tags }}
          PRERELEASE_TAGS: ${{ needs.prerelease.outputs.tags }}
          IMAGE: ${{ needs.release.outputs.image }}
          RELEASE_SIGNATURE: ${{ needs.release.outputs.signature }}
          SIGNED_DIGEST: ${{ needs.signed.outputs.digest }}
          SIGNED_SIGNATURE: ${{ needs.signed.outputs.signature }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          has() { grep -qx "${IMAGE}:$2" <<<"$1"; }
          for t in 1.2.3 1.2 latest testing; do
            has "$RELEASE_TAGS" "$t" || fail "release build missing tag $t"
          done
          grep -q "^${IMAGE}:sha-" <<<"$RELEASE_TAGS" || fail "release build missing sha- tag"

          has "$PRERELEASE_TAGS" 1.3.0-rc.0 || fail "prerelease build missing tag 1.3.0-rc.0"
          for t in 1.3 latest; do
            if has "$PRERELEASE_TAGS" "$t"; then fail "prerelease build must not get tag $t"; fi
          done

          [ -z "$RELEASE_SIGNATURE" ] || fail "sign must be skipped when push is false"
          [ -n "$SIGNED_DIGEST" ] || fail "signed build has no digest"
          [ "$SIGNED_SIGNATURE" = "${SIGNED_DIGEST/:/-}" ] || fail "unexpected signature tag: $SIGNED_SIGNATURE"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify signature
        env:
          IMAGE: ${{ needs.signed.outputs.image }}
          TAG: signed-${{ github.run_id }}
          REPO: ${{ github.repository }}
          TAGS: ${{ needs.signed.outputs.tags }}
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          cosign login ghcr.io -u "$ACTOR" --password-stdin <<<"$GH_TOKEN"
          cosign verify \
            --certificate-identity-regexp "https://github.com/${REPO}/.github/workflows/.*" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            -a "sha=$(grep -o ':sha-[0-9a-f]*$' <<<"$TAGS" | head -n1 | cut -c2-)" \
            "${IMAGE}:${TAG}"

  cleanup:
    needs: [setup, release, prerelease, signed, verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Delete fixture branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          RUN_ID: ${{ github.run_id }}
          DIGEST: ${{ needs.signed.outputs.digest }}
        run: |
          failed=0
          # Deletes refs/<$1>. A ref that is already gone is fine; any other error fails the job after all deletions
          # have been attempted, so leftovers are noticed.
          delete_ref() {
            local out
            if out=$(gh api -X DELETE "repos/${REPO}/git/refs/$1" 2>&1); then
              echo "Deleted $1"
            elif grep -q "Reference does not exist" <<<"$out"; then
              echo "Already gone: $1"
            else
              echo "::error::Could not delete $1: $out"
              failed=1
            fi
          }
          delete_ref "heads/${BASE}"

          # Delete the signed test image's index and its signature tag. A failure only warns, so a leftover does not
          # hide the test result.
          if [ -n "$DIGEST" ]; then
            versions="orgs/${OWNER}/packages/container/container-build-test/versions"
            ids=$(gh api --paginate "$versions" --jq ".[] | select(any(.metadata.container.tags[];
              . == \"signed-${RUN_ID}\" or . == \"${DIGEST/:/-}\") or .name == \"${DIGEST}\") | .id") || ids=""
            for id in $ids; do
              gh api -X DELETE "${versions}/${id}" && echo "Deleted package version $id" \
                || echo "::warning::Could not delete package version $id"
            done
          fi
          exit "$failed"
