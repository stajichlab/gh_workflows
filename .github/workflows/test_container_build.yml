name: Test container_build

# End-to-end test: build a tiny image from a throwaway orphan branch for a release and a prerelease version, run the
# smoke test, and check the computed tags. Nothing is pushed to the registry.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/container_build.yml
      - .github/workflows/test_container_build.yml

concurrency:
  group: test-container-build
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  BASE: test/container-${{ github.run_id }}

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.fixture.outputs.ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create fixture branch
        id: fixture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan "$BASE"
          cat > Dockerfile <<'DOCKER'
          FROM busybox:1.36
          ARG GREETING=hello
          RUN echo "$GREETING" > /greeting
          ENTRYPOINT ["sh", "-c", "cat /greeting && echo \"$@\"", "--"]
          DOCKER
          git add Dockerfile
          git commit -m "Test fixture"
          git push origin "$BASE"
          echo "ref=$BASE" >> "$GITHUB_OUTPUT"

  release:
    needs: setup
    uses: ./.github/workflows/container_build.yml
    with:
      ref: ${{ needs.setup.outputs.ref }}
      version: v1.2.3
      image: ghcr.io/${{ github.repository_owner }}/container-build-test
      build_args: GREETING=smoke-ok
      smoke_test_args: --version
      latest: true
      extra_tags: testing
      push: false

  prerelease:
    needs: setup
    uses: ./.github/workflows/container_build.yml
    with:
      ref: ${{ needs.setup.outputs.ref }}
      version: 1.3.0-rc.0
      image: ghcr.io/${{ github.repository_owner }}/container-build-test
      latest: true
      push: false

  verify:
    needs: [release, prerelease]
    runs-on: ubuntu-latest
    steps:
      - name: Check tags
        env:
          RELEASE_TAGS: ${{ needs.release.outputs.tags }}
          PRERELEASE_TAGS: ${{ needs.prerelease.outputs.tags }}
          IMAGE: ${{ needs.release.outputs.image }}
        run: |
          fail() { echo "::error::$*"; exit 1; }
          has() { grep -qx "${IMAGE}:$2" <<<"$1"; }
          for t in 1.2.3 1.2 latest testing; do
            has "$RELEASE_TAGS" "$t" || fail "release build missing tag $t"
          done
          grep -q "^${IMAGE}:sha-" <<<"$RELEASE_TAGS" || fail "release build missing sha- tag"

          has "$PRERELEASE_TAGS" 1.3.0-rc.0 || fail "prerelease build missing tag 1.3.0-rc.0"
          for t in 1.3 latest; do
            if has "$PRERELEASE_TAGS" "$t"; then fail "prerelease build must not get tag $t"; fi
          done

  cleanup:
    needs: [setup, release, prerelease, verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Delete fixture branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh api -X DELETE "repos/${REPO}/git/refs/heads/${BASE}" || true
